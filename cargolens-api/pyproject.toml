[project]
name = "cargolens-api"
version = "0.1.0"
description = "CargoLens AI — Intelligent Import Documentation & Verification Platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<0.116.0",
    "uvicorn[standard]>=0.28.0,<0.33.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.28,<2.1.0",
    "asyncpg>=0.29.0,<0.31.0",
    "alembic>=1.13.0,<1.15.0",
    "httpx>=0.27.0,<0.29.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "pillow>=10.2.0",
    "pymupdf>=2.1.0,<3.0.0",
    "pytesseract>=0.3.10",
    "anthropic>=0.40.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.25.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.alembic]
script_location = "alembic"
